<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./bmi.css">
    <script src="./bmi.js"></script>
</head>
<body>
        <h2>BMI CALCULATOR</h2>

    <div class="container">
        <!-- <h2>BMI CALCULATOR</h2> -->
    <!-- unit  selection -->
     <div class="unit">
          <label for="unitsystem" class="label">Unit System</label> 
          <!-- <br> -->
          <select name="system" id="unitsystem" onchange="toggleunit()">
            <option value="Metric">Metric (kg / cm)</option>
            <option value="Imperial">Imperial (lb / inches)</option>
          </select>
     </div>
     <!-- <br> -->
    <!-- <div class="container"> -->
        <!-- <h2>BMI CALCULATOR</h2> -->
        <!-- age -->
        <label for="Age" id="agelabel">Age (years)</label>
         <!-- <br> -->
        <input type="number" id="age" min="1" >
        <!-- <BR> -->
        <!-- weight -->
         <label for="weight" id="weightlabel">Weight (kg)</label> 
         <!-- <br> -->
         <input type="number" id="weight" min="1" >
         <!-- <br> -->
         <!-- <br> -->
           <!-- height -->
            <label for="height" id="heightlabel">Height (cm)</label> 
            <!-- <br> -->

            <input type="number" id="height" min="1">
            <br>
            <button onclick="calc()">submit</button>
        <br>
            <div id="result">
                YOUR BMI: 
            </div>
            <!-- <br> <br> -->
            <!-- table formula -->
             <table>
                <th>BMI</th>
                <th>STATUS</th>
                <tr>
                    <td> 18.5 </td>
                    <td>Underweight</td>
                </tr>
                <tr>
                    <td>18.5-24.9</td>
                    <td>Healthy Weight</td>
                </tr>
                <tr>
                    <td>25.0-29.9</td>
                    <td>Overweight</td>
                </tr>
                <tr>
                    <td>>=30.0</td>
                    <td>Obese</td>
                </tr>
             </table>
    </div>
</body>
</html>
