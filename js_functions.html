// 10. Grade Function: Write a JavaScript program that defines a function 
// findGrade(mark) which accepts a student's mark and uses if...else if...else 
// to return the grade A, B, C, D, or F based on the mark.


function findmark(mark) {
if(mark>=90){
    console.log("GRADE A: "+mark)
}
else if(mark>=70){
    console.log("GRADE B :"+mark);
}
else if(mark>=50){
    console.log("GRADE C :"+mark);
}
else if(mark>=30){
    console.log("GRADE D :"+mark);
}
else if(mark>=20){
    console.log("GRADE E :"+mark);
    
}
else if(mark>=10){
    console.log("GRADE F :"+mark);
}
else{
    console.log("FAIL");
    
}
}
